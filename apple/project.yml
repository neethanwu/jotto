name: Jotto
options:
  bundleIdPrefix: com.neethanwu
  deploymentTarget:
    iOS: "26.0"
    watchOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: AV25N53237  # Hallidai Inc.
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    # Brand assets live in each app's Assets.xcassets (source art: brand/logo/final/).
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
targets:
  Jotto:
    type: application
    platform: iOS
    scheme: {}
    # The watch's segment writer records on the phone too.
    sources: [Apps/iOS, Apps/PhoneShared, Apps/Watch/SegmentWriter.swift, Apps/Privacy]
    dependencies:
      - target: JottoWatch
      - target: JottoLiveActivity
      - target: JottoAssets
    # Shared with the asset-pack downloader (and the watch's complications).
    entitlements:
      path: Apps/iOS/Jotto.entitlements
      properties:
        com.apple.security.application-groups: [group.com.neethanwu.jotto]
    info:
      path: Apps/iOS/Info.plist
      properties:
        CFBundleDisplayName: jotto
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        NSSupportsLiveActivities: true
        # Recording on the iPhone keeps going with the screen locked.
        UIBackgroundModes: [audio]
        NSMicrophoneUsageDescription: Jotto records through the microphone when you start a recording on your iPhone.
        # Opens a recording's Live screen from its lock-screen activity.
        CFBundleURLTypes:
          - CFBundleURLName: com.neethanwu.jotto
            CFBundleURLSchemes: [jotto]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # Lets the app talk to a dev server on localhost / the Mac's LAN address.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # The Qwen3-ASR model as an asset pack App Store Connect hosts
        # (AssetPacks/qwen3-asr), fetched through the App Store.
        BAAppGroupID: group.com.neethanwu.jotto
        BAHasManagedAssetPacks: true
        BAUsesAppleHosting: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.neethanwu.jotto
        TARGETED_DEVICE_FAMILY: "1"  # iPhone only
  JottoAssets:
    type: extensionkit-extension
    platform: iOS
    sources: [Apps/Assets]
    entitlements:
      path: Apps/Assets/JottoAssets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.neethanwu.jotto]
    info:
      path: Apps/Assets/Info.plist
      properties:
        CFBundleDisplayName: jotto
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        EXAppExtensionAttributes:
          EXExtensionPointIdentifier: com.apple.background-asset-downloader-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.neethanwu.jotto.assets
        TARGETED_DEVICE_FAMILY: "1"
  JottoLiveActivity:
    type: app-extension
    platform: iOS
    sources: [Apps/LiveActivity, Apps/PhoneShared, Apps/Privacy]
    info:
      path: Apps/LiveActivity/Info.plist
      properties:
        CFBundleDisplayName: jotto
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.neethanwu.jotto.liveactivity
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) JOTTO_LIVE_EXTENSION
  JottoWatch:
    type: application
    platform: watchOS
    scheme: {}
    sources: [Apps/Watch, Apps/Shared, Apps/Privacy]
    dependencies:
      - target: JottoWatchWidgets
    entitlements:
      path: Apps/Watch/JottoWatch.entitlements
      properties:
        com.apple.security.application-groups: [group.com.neethanwu.jotto]
    info:
      path: Apps/Watch/Info.plist
      properties:
        CFBundleDisplayName: jotto
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.neethanwu.jotto
        # Keeps recording with the screen off (Background Modes → Audio).
        UIBackgroundModes: [audio]
        NSMicrophoneUsageDescription: Jotto records through the microphone while you talk.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.neethanwu.jotto.watchkitapp
  JottoWatchWidgets:
    type: app-extension
    platform: watchOS
    sources: [Apps/WatchWidgets, Apps/Shared, Apps/Privacy]
    entitlements:
      path: Apps/WatchWidgets/JottoWatchWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.neethanwu.jotto]
    info:
      path: Apps/WatchWidgets/Info.plist
      properties:
        CFBundleDisplayName: jotto
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.neethanwu.jotto.watchkitapp.widgets
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) JOTTO_WIDGETS
