name: Jotto
options:
  bundleIdPrefix: com.neethanwu
  deploymentTarget:
    iOS: "26.0"
    watchOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: AV25N53237  # Hallidai Inc.
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Brand assets live in each app's Assets.xcassets (source art: brand/logo/final/).
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
targets:
  Jotto:
    type: application
    platform: iOS
    scheme: {}
    sources: [Apps/iOS]
    dependencies:
      - target: JottoWatch
    info:
      path: Apps/iOS/Info.plist
      properties:
        CFBundleDisplayName: Jotto
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # Lets the app talk to a dev server on localhost / the Mac's LAN address.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.neethanwu.jotto
  JottoWatch:
    type: application
    platform: watchOS
    scheme: {}
    sources: [Apps/Watch]
    info:
      path: Apps/Watch/Info.plist
      properties:
        CFBundleDisplayName: Jotto
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.neethanwu.jotto
        WKBackgroundModes: [audio]
        NSMicrophoneUsageDescription: Jotto records through the microphone while you talk.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.neethanwu.jotto.watchkitapp
