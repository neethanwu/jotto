name: Jotto
options:
  bundleIdPrefix: com.neethanwu
  deploymentTarget:
    iOS: "26.0"
    watchOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: AV25N53237  # Hallidai Inc.
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "1"
    # Brand assets live in each app's Assets.xcassets (source art: brand/logo/final/).
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
targets:
  Jotto:
    type: application
    platform: iOS
    scheme: {}
    sources: [Apps/iOS]
    dependencies:
      - target: JottoWatch
    info:
      path: Apps/iOS/Info.plist
      properties:
        CFBundleDisplayName: jotto
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # Lets the app talk to a dev server on localhost / the Mac's LAN address.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.neethanwu.jotto
        TARGETED_DEVICE_FAMILY: "1"  # iPhone only
  JottoWatch:
    type: application
    platform: watchOS
    scheme: {}
    sources: [Apps/Watch, Apps/Shared]
    dependencies:
      - target: JottoWatchWidgets
    info:
      path: Apps/Watch/Info.plist
      properties:
        CFBundleDisplayName: jotto
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.neethanwu.jotto
        # Keeps recording with the screen off (Background Modes → Audio).
        UIBackgroundModes: [audio]
        NSMicrophoneUsageDescription: Jotto records through the microphone while you talk.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.neethanwu.jotto.watchkitapp
  JottoWatchWidgets:
    type: app-extension
    platform: watchOS
    sources: [Apps/WatchWidgets, Apps/Shared]
    info:
      path: Apps/WatchWidgets/Info.plist
      properties:
        CFBundleDisplayName: jotto
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.neethanwu.jotto.watchkitapp.widgets
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) JOTTO_WIDGETS
